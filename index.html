const W = CONFIG.view.W, H = CONFIG.view.H, HUD = CONFIG.view.hudH, WS = CONFIG.world.size;
const VIEW_H = H - HUD;
const WORLD_OY = HUD + Math.max(0, (VIEW_H - WS) / 2);
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);
resize();

/* ---------- utils ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const choice = a => a[Math.floor(Math.random() * a.length)];
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((cx - x1) * dx + (cy - y1) * dy) / l2, 0, 1);
  const px = x1 + dx * t - cx, py = y1 + dy * t - cy;
  return px * px + py * py < r * r;
}
function segBlocked(x1, y1, x2, y2) {
  for (const r of CONFIG.arena.rocks) if (segCircle(x1, y1, x2, y2, r.x, r.y, r.r * 0.9)) return true;
  return false;
}
function hitsRock(x, y, r) {
  for (const c of CONFIG.arena.rocks) if (Math.hypot(x - c.x, y - c.y) < c.r + r) return true;
  return false;
}
function blockedPoint(x, y, r) {
  const P = CONFIG.arena.pit;
  return hitsRock(x, y, r) || Math.hypot(x - P.x, y - P.y) < P.r + r;
}
function inMud(o) { const M = CONFIG.arena.mud; return Math.hypot(o.x - M.x, o.y - M.y) < M.r; }
// push a circle out of walls/rocks/pit; returns the obstacle it collided with (or null)
function pushOut(o, r, withPit) {
  let hit = null;
  o.x = clamp(o.x, r, WS - r); o.y = clamp(o.y, r, WS - r);
  const rocks = CONFIG.arena.rocks;
  for (let i = 0; i <= rocks.length; i++) {
    const c = i < rocks.length ? rocks[i] : (withPit ? CONFIG.arena.pit : null);
    if (!c) continue;
    const dx = o.x - c.x, dy = o.y - c.y, d = Math.hypot(dx, dy), m = c.r + r;
    if (d < m) { if (d < 0.001) { o.x += m; } else { o.x = c.x + dx / d * m; o.y = c.y + dy / d * m; } hit = c; }
  }
  return hit;
}
function satMult(s) {
  const S = CONFIG.saturation, c = S.curve;
  if (s <= S.starvingAt) return S.starvingMult;
  if (s >= c[c.length - 1][0]) return c[c.length - 1][1];
  for (let i = 0; i < c.length - 1; i++) {
    if (s <= c[i + 1][0]) { const t = (s - c[i][0]) / (c[i + 1][0] - c[i][0]); return c[i][1] + (c[i + 1][1] - c[i][1]) * t; }
  }
  return 1;
}
function fmtTime(t) { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

/* ---------- persistence ---------- */
function loadAcorns() {
  try { const v = localStorage.getItem(CONFIG.acorns.storageKey); if (v !== null && !isNaN(+v)) return +v; } catch (e) {}
  return CONFIG.revive.startingAcornBank;
}
function saveAcorns() { try { localStorage.setItem(CONFIG.acorns.storageKey, String(acornBank)); } catch (e) {} }

/* ---------- global state ---------- */
let state = 'title';      // title | play | down | clear | levelup | shop | pause | over
let G = null;
let acornBank = loadAcorns();
let buttons = [];
let keys = {};
let dashReq = false;
let joy = null;
let touchMode = false;
let lastError = null;
let debugOn = false, debugWave = 1;
const tufts = [];
for (let i = 0; i < 160; i++) tufts.push({ x: rand(10, WS - 10), y: rand(10, WS - 10), s: rand(2, 5), c: Math.random() < 0.5 ? '#5d9c45' : '#7cbf5a' });

function newRun(startAt) {
  const S = CONFIG.saturation, st = CONFIG.arena.start;
  G = {
    wave: 0, clock: CONFIG.clock.startLead, time: 0, waveT: 0, par: 20,
    p: { x: st.x, y: st.y, r: CONFIG.player.radius, fx: 1, fy: 0, sat: S.start, cap: S.cap, inv: 0, dashInv: 0, dashT: 0, dashCd: 0, dashDx: 1, dashDy: 0, swing: null, moving: false },
    weapons: [mkWeapon(CONFIG.player.startWeapon, 0)],
    passives: {}, stats: { dmg: 1, spd: 1, atk: 1, mag: 1, arm: 0, app: 1, dash: 1 },
    enemies: [], shots: [], eshots: [], foods: [], parts: [], texts: [], tele: [], fx: [],
    queue: [], level: 1, xp: 0, pendingLv: 0, kills: 0,
    tierCounts: { 'Blur': 0, 'Brisk': 0, 'Scraped Through': 0, 'Over par': 0 },
    acornsRun: 0, acornsSpent: 0, dist: 0, distAcc: 0, adRevUsed: false, acornRevives: 0,
    offers: [], rerolls: 0, freeReroll: true, shake: 0, hitstop: 0, banner: null,
    hpMul: 1, dmgMul: 1, reinforced: false, secondWindUsed: false, tutorial: false, spawnT: 0, waveCount: 0,
    lvChoices: [], clearInfo: null, clearT: 0, downT: 0, endReason: '', victory: false, bestWave: 0, bossesKilled: 0
  };
  dashReq = false; joy = null; keys = {};
  const n = startAt || 1;
  startWave(n);
  if (n > 1) applyDebugBuild(n);
  state = 'play';
}
function mkWeapon(id, tier) { return { id, tier, t: rand(0.1, 0.4) }; }
function sectionOf(n) { return Math.floor((n - 1) / CONFIG.waves.perSection); }
function poolFor(n) {
  const sec = sectionOf(n), idx = (n - 1) % CONFIG.waves.perSection, S = CONFIG.sections;
  if (sec === 0) return S[0].slice(0, Math.min(6, Math.max(1, idx + 1)));
  const pool = [];
  for (let s = 0; s < sec; s++) for (const t of S[s]) pool.push(t);
  for (const t of S[sec]) { pool.push(t); pool.push(t); }   // newer types weighted double
  return pool;
}
function parFor(n) {
  const WV = CONFIG.waves, boss = (n - 1) % WV.perSection === WV.perSection - 1;
  return Math.round(WV.parBase + (n - 1) * WV.parPerWave) + (boss ? WV.bossParBonus : 0);
}
function startWave(n) {
  const WV = CONFIG.waves;
  G.wave = n;
  const sec = sectionOf(n), idx = (n - 1) % WV.perSection, boss = idx === WV.perSection - 1;
  G.par = parFor(n);
  G.clock += G.par;                                   // AI-proposed rule: par time is added at wave start
  G.waveT = 0; G.reinforced = false; G.secondWindUsed = false; G.tutorial = (n === 1);
  G.hpMul = 1 + (n - 1) * WV.hpScalePerWave;
  G.dmgMul = (1 + (n - 1) * WV.dmgScalePerWave) * WV.enemyDmgMult;
  const pool = poolFor(n);
  G.queue = [];
  if (boss) {
    G.queue.push(CONFIG.bossBySection[sec]);
    const minions = WV.bossMinionsBase + sec * WV.bossMinionsPerSection;
    for (let i = 0; i < minions; i++) G.queue.push(choice(pool));
  } else {
    const count = n === 1 ? WV.tutorialCount : Math.round(WV.countBase + n * WV.countPerWave);
    for (let i = 0; i < count; i++) G.queue.push(choice(pool));
  }
  G.waveCount = G.queue.length;
  G.spawnT = WV.spawnLead;
  G.enemies = []; G.shots = []; G.eshots = []; G.tele = []; G.foods = []; G.fx = [];
  G.p.inv = Math.max(G.p.inv, WV.waveStartInvuln);
  G.p.swing = null;
  const bossName = boss ? CONFIG.bosses[CONFIG.bossBySection[sec]].name : '';
  G.banner = { text: boss ? 'BOSS: ' + bossName : 'Wave ' + n, sub: 'Par ' + G.par + 's  (+' + G.par + 's added to the clock)', t: 2.2, T: 2.2, color: boss ? '#ff6b6b' : '#fff' };
}
function remaining() {
  let a = 0; for (const e of G.enemies) if (!e.dead) a++;
  return a + G.queue.length + G.tele.length;
}

/* ---------- spawning ---------- */
function spawnPos(r) {
  for (let i = 0; i < 40; i++) {
    const x = rand(40, WS - 40), y = rand(40, WS - 40);
    if (Math.hypot(x - G.p.x, y - G.p.y) < CONFIG.waves.spawnKeepAway) continue;
    if (blockedPoint(x, y, r + 6)) continue;
    return { x, y };
  }
  return { x: G.p.x < WS / 2 ? WS - 50 : 50, y: 50 };
}
function defOf(type) { return CONFIG.enemies[type] || CONFIG.bosses[type]; }
function spawnEnemy(type, x, y) {
  const d = defOf(type), boss = !!CONFIG.bosses[type];
  const hp = boss ? d.hp : d.hp * G.hpMul;
  const e = { type, d, boss, x, y, r: d.r, hp, maxHp: hp, kbx: 0, kby: 0, kbT: 0, slowT: 0, flash: 0, t: 0,
              state: 'move', st: 0, cd: rand(0.8, 2), cd2: 4, dx: 1, dy: 0, fx: 1, fy: 0, phase: Math.random() * 6.28, under: d.ai === 'mole', pitCd: 0, aim: 0 };

/* ---------- player ---------- */

function updatePlayer(dt) {

/* ---------- weapons ---------- */
function nearestEnemy(x, y, maxD) {

}

function enemyShot(x, y, a, speed, dmg, r, color) { G.eshots.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, dmg, r, color, life: 4 }); }
function updateWeapons(dt) {
  const p = G.p;

    const d = CONFIG.weapons[w.id], T = CONFIG.weaponTiers[w.tier];
    w.t -= dt; if (w.t > 0) continue;

    } else if (d.type === 'ring') {

      const R = d.range * (1 + 0.1 * w.tier);

/* ---------- enemies ---------- */
function damageEnemy(e, amt, raw, kbx, kby) {

  e.hp -= amt; e.flash = 0.1;
  if (kbx || kby) { const res = e.boss ? 0.9 : (e.d.kbRes || 0); e.kbx += kbx * (1 - res); e.kby += kby * (1 - res); e.kbT = 0.3; }
  floatText(e.x + rand(-6, 6), e.y - e.r - 4, Math.max(1, Math.round(amt)), raw ? '#ff9ad5' : '#fff', 0.55, 12);
  if (Math.random() < 0.5) burst(e.x, e.y, e.d.color, 2, 80, 2);
  if (e.hp <= 0) killEnemy(e);
}
function dropFood(x, y, total) {

  for (let i = 0; i < n; i++) {

}
function xpNeed() { return CONFIG.xp.base + CONFIG.xp.perLevel * (G.level - 1); }
function gainXp(x) {

}
function killEnemy(e) {

  burst(e.x, e.y, e.d.color, e.boss ? 40 : 9, e.boss ? 260 : 140, e.boss ? 5 : 3);
  if (e.d.split) for (let k = 0; k < e.d.splitN; k++) { const c = spawnEnemy(e.d.split, e.x + rand(-8, 8), e.y + rand(-8, 8)); const a = rand(0, 6.28); c.kbx = Math.cos(a) * 160; c.kby = Math.sin(a) * 160; }
  if (e.boss) {
    G.acornsRun += CONFIG.acorns.perBoss; G.bossesKilled++;
    G.shake = 16; G.hitstop = 0.18;
    G.banner = { text: e.d.name + ' defeated!', sub: '+' + CONFIG.acorns.perBoss + ' acorns', t: 2, T: 2, color: '#ffe066' };
  } else if (e.r >= 15) G.hitstop = Math.max(G.hitstop, 0.03);
}
function explode(e) {
  const p = G.p, R = 80;

  burst(e.x, e.y, '#ff7043', 18, 220, 4);
  G.shake = Math.max(G.shake, 8);
  e.dead = true;
  dropFood(e.x, e.y, 1);

}
// shared charge / lunge logic; returns [mx,my,mult] while busy, null when free to move normally
function chargeStep(e, dt, o, ux, uy) {
  if (e.state === 'wind') { e.st -= dt; if (e.st <= 0) { e.state = 'charge'; e.st = o.charge; } return [0, 0, 0]; }
  if (e.state === 'charge') { e.st -= dt; if (e.st <= 0) { e.state = 'rest'; e.st = o.rest; e.cd = o.cd; } return [e.dx, e.dy, o.mult]; }

function WVd() { return CONFIG.waves.enemyDmgMult; }
function norm2(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }
function updateEnemies(dt) {

}

/* ---------- projectiles, food, fx ---------- */
function updateShots(dt) {
  for (const s of G.shots) {

    if (hitsRock(s.x, s.y, s.r) || s.x < 0 || s.y < 0 || s.x > WS || s.y > WS) { s.dead = true; burst(s.x, s.y, s.color, 3, 60, 2); continue; }
    for (const e of G.enemies) {

  }

  const p = G.p;
  for (const s of G.eshots) {
    s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0 || hitsRock(s.x, s.y, s.r) || s.x < 0 || s.y < 0 || s.x > WS || s.y > WS) { s.dead = true; continue; }
    if (Math.hypot(p.x - s.x, p.y - s.y) < p.r + s.r) { s.dead = true; hurtPlayer(s.dmg); if (state !== 'play') break; }

}
function updateFood(dt) {

    const dx = p.x - f.x, dy = p.y - f.y, d = Math.hypot(dx, dy) || 1;
    if (d < range) { const s = CONFIG.food.magnetSpeed * (1 - d / range * 0.5); f.x += dx / d * s * dt; f.y += dy / d * s * dt; }

function updateFx(dt) {
  for (const q of G.parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; }

/* ---------- wave flow ---------- */
function onWaveClear() {
  const p = G.p, frac = G.waveT / G.par;
  let tier = null;
  for (const t of CONFIG.tiers) if (frac <= t.maxFrac) { tier = t; break; }
  for (const f of G.foods) p.sat = Math.min(p.cap, p.sat + f.v * G.stats.app);   // vacuum leftover food
  G.foods = [];
  if (tier) { G.clock += tier.seconds; p.sat = Math.min(p.cap, p.sat + tier.food); G.tierCounts[tier.name]++; }
  else G.tierCounts['Over par']++;

  G.bestWave = G.wave;
  G.clearInfo = { tier, time: G.waveT, par: G.par, wave: G.wave };
  G.eshots = []; G.shots = [];
  if (G.wave >= CONFIG.waves.total) { endRun(true, 'Swine survived all ' + CONFIG.waves.total + ' waves. Benedict goes home hungry!'); return; }
  state = 'clear'; G.clearT = CONFIG.waves.clearHold;
}
function afterClear() { if (G.pendingLv > 0) openLevelUp(); else openShop(); }
function openLevelUp() { G.lvChoices = shuffle(CONFIG.levelUps.slice()).slice(0, 3); state = 'levelup'; }
function applyLevelUp(u) {

}

}
function goDownExpire() { endRun(false, 'Swine collapsed from hunger.'); }
function reviveCost() { return CONFIG.revive.acornBase * Math.pow(2, G.acornRevives); }

function doRevive(kind) {
  if (kind === 'ad') { if (G.adRevUsed) return; G.adRevUsed = true; }
  else {
    const c = reviveCost(); if (acornsAvailable() < c) return;
    let left = c; const fromRun = Math.min(G.acornsRun, left); G.acornsRun -= fromRun; left -= fromRun; acornBank -= left; saveAcorns();
    G.acornRevives++; G.acornsSpent += c;
  }
  const p = G.p;
  p.sat = CONFIG.saturation.reviveTo; p.inv = CONFIG.saturation.reviveInvuln;
  const rv = CONFIG.revive;
  for (const e of G.enemies) { const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1; if (d < rv.pushRadius) { const res = e.boss ? rv.bossResist : 0; e.kbx += dx / d * rv.pushKnock * (1 - res); e.kby += dy / d * rv.pushKnock * (1 - res); } }
  G.eshots = [];
  G.fx.push({ kind: 'ring', x: p.x, y: p.y, r: rv.pushRadius, t: 0.5, T: 0.5, color: '#fff' });
  floatText(p.x, p.y - 30, 'BACK ON HIS TROTTERS!', '#fff', 1.4, 16);
  state = 'play';
}

/* ---------- shop ---------- */
function priceScale() { return 1 + CONFIG.shop.priceScalePerWave * (G.wave - 1); }
function priceOf(o) {
  let base;
  if (o.kind === 'weapon') base = CONFIG.weapons[o.id].price * CONFIG.shop.tierPriceMult[o.tier];
  else if (o.kind === 'passive') base = CONFIG.passives[o.id].price;
  else base = CONFIG.meals[o.id].price;
  return Math.max(1, Math.round(base * priceScale()));
}
function canAfford(price) { return G.clock - price >= CONFIG.clock.minAfterPurchase - 1e-9; }
function rollTier() {
  const w = G.wave, r = Math.random(), S = CONFIG.shop;
  const p2 = clamp((w - S.tierPrizedFromWave) / S.tierPrizedSpan, 0, S.tierPrizedMax), p1 = clamp(w / S.tierSolidSpan, 0, S.tierSolidMax);
  if (r < p2) return 2; if (r < p2 + p1) return 1; return 0;
}
function genOffer() {
  const r = Math.random(), S = CONFIG.shop;
  if (r < S.weaponChance) return { kind: 'weapon', id: choice(Object.keys(CONFIG.weapons)), tier: rollTier() };
  if (r < S.passiveChanceEnd) {
    const ids = Object.keys(CONFIG.passives).filter(id => CONFIG.passives[id].stack || !G.passives[id]);
    return { kind: 'passive', id: choice(ids), tier: 0 };
  }
  return { kind: 'meal', id: Math.random() < S.stewChance ? 'stew' : 'feast', tier: 0 };
}
function genOffers(keepLocked) {
  const out = keepLocked ? G.offers.filter(o => o && o.locked && !o.sold) : [];
  while (out.length < CONFIG.shop.slots) out.push(genOffer());
  G.offers = out;
}
function openShop() { G.freeReroll = true; G.rerolls = 0; genOffers(true); state = 'shop'; }
function weaponMergeTarget(id) {
  let best = null;
  for (const w of G.weapons) if (w.id === id && w.tier < CONFIG.shop.maxTier && (!best || w.tier < best.tier)) best = w;
  return best;
}
function offerStatus(o) {

  if (o.kind === 'weapon') {
    const m = weaponMergeTarget(o.id);
    if (m) return { ok: true, merge: m };

}
function grantPassiveItem(id) {

}
function grantWeapon(id, tier) {

}
function grantWeaponAtTier(id, tier) {

  let guard = 0;
  while (guard++ < 8) {

}
function debugLevelFor(n) {
  const D = CONFIG.debugStart, last = CONFIG.waves.total;
  const t = last <= 1 ? 1 : (n - 1) / (last - 1);
  return Math.round(D.levelAtWave1 + (D.levelAtFinal - D.levelAtWave1) * t);
}
function debugTierFor(n, index) {
  const D = CONFIG.debugStart;
  if (n >= D.legendaryFrom && index < D.legendaryCount) return CONFIG.shop.maxTier;
  if (n >= D.prizedFrom) return 2;
  if (n >= D.solidFrom) return 1;

}
function applyDebugBuild(n) {
  const D = CONFIG.debugStart, S = CONFIG.saturation;
  const tBelly = clamp((n - 1) / Math.max(1, D.bellyFullBy - 1), 0, 1);
  G.p.cap = S.cap;
  G.p.sat = Math.min(G.p.cap, D.bellyFrom + (D.bellyTo - D.bellyFrom) * tBelly);
  const ups = Math.max(0, debugLevelFor(n) - 1);

    const u = CONFIG.levelUps.find(x => x.id === id);
    if (u) applyLevelUp(u);
  }
  G.level = 1 + ups;
  G.xp = 0;
  G.pendingLv = 0;

  const ids = [CONFIG.player.startWeapon].concat(D.extraWeapons.slice(0, extraN));

}

}

/* ---------- main update ---------- */
function update(dt) {
  if (!G) return;
  if (state === 'play') {
    if (G.hitstop > 0) { G.hitstop -= dt; return; }
    G.time += dt; G.waveT += dt;
    G.clock -= dt;                                    // Benedict's clock (does not tick in shop / menus)
    if (G.tutorial) G.clock = Math.max(G.clock, CONFIG.clock.minAfterPurchase);
    if (G.clock <= 0) { G.clock = 0; endRun(false, 'Benedict grabbed Swine! The clock ran out.'); return; }
    updatePlayer(dt); if (state !== 'play') return;
    updateWeapons(dt);
    updateSpawns(dt);
    updateEnemies(dt); if (state !== 'play') return;
    updateShots(dt); if (state !== 'play') return;
    updateFood(dt);
    updateFx(dt);
    if (G.waveT > CONFIG.waves.clearArmTime && remaining() === 0) onWaveClear();
  } else if (state === 'down') {
    G.downT -= dt; updateFx(dt * 0.3);
    if (G.downT <= 0) goDownExpire();

/* =========================== RENDERING ============================ */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';

}

function renderWorld() {

/* ============================ INPUT ============================== */
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Backquote') { debugOn = !debugOn; e.preventDefault(); return; }
  if (debugOn && (e.code === 'Minus' || e.code === 'NumpadSubtract' || e.code === 'BracketLeft')) { debugWave = clamp(debugWave - 1, 1, CONFIG.waves.total); return; }
  if (debugOn && (e.code === 'Equal' || e.code === 'NumpadAdd' || e.code === 'BracketRight')) { debugWave = clamp(debugWave + 1, 1, CONFIG.waves.total); return; }
  const enter = e.code === 'Enter' || e.code === 'NumpadEnter';
  if (state === 'title') { if (enter || e.code === 'Space') newRun(); return; }
  if (state === 'play') {
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') dashReq = true;
    if (e.code === 'KeyP' || e.code === 'Escape') state = 'pause';
  } else if (state === 'pause') { if (e.code === 'KeyP' || e.code === 'Escape' || enter) state = 'play'; }
  else if (state === 'clear') { if (enter || e.code === 'Space') afterClear(); }
  else if (state === 'levelup') { const n = parseInt(e.key, 10); if (n >= 1 && n <= G.lvChoices.length) chooseLevel(G.lvChoices[n - 1]); }
  else if (state === 'shop') {
    const n = parseInt(e.key, 10); if (n >= 1 && n <= CONFIG.shop.slots) buyOffer(n - 1);
    if (e.code === 'KeyR') reroll(false);
    if (e.code === 'KeyM') buySmallMeal();
    if (enter) nextWave();
  } else if (state === 'down') { if (e.code === 'KeyA') doRevive('ad'); if (e.code === 'KeyC') doRevive('acorn'); }
  else if (state === 'over') { if (enter) newRun(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { keys = {}; joy = null; if (state === 'play') state = 'pause'; });
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.focus(); } catch (err) {}
  if (e.pointerType === 'touch' || e.pointerType === 'pen') touchMode = true;
  const q = toLogical(e);
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (q.x >= b.x && q.x <= b.x + b.w && q.y >= b.y && q.y <= b.y + b.h) { if (!b.disabled) b.onClick(); return; }
  }
  if (state === 'play' && e.pointerType !== 'mouse' && q.x < W / 2 && q.y > HUD) {
    joy = { id: e.pointerId, ox: q.x, oy: q.y, x: q.x, y: q.y };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (state === 'clear') afterClear();
});
cv.addEventListener('pointermove', e => {
  if (!joy || e.pointerId !== joy.id) return;
  const q = toLogical(e); joy.x = q.x; joy.y = q.y;
  const R = CONFIG.touch.joyRadius * 1.6, dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy);
  if (l > R) { joy.ox = joy.x - dx / l * R; joy.oy = joy.y - dy / l * R; }   // floating stick follows the thumb
});
function endPointer(e) { if (joy && e.pointerId === joy.id) joy = null; }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ============================ LOOP =============================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  try { update(dt); render(); }
  catch (err) { lastError = err && err.message ? err.message : String(err); console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
